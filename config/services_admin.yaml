services:
  _defaults:
    autowire: false
    autoconfigure: false

  perspeqtive.sulu_media.collection_metadata:
    class: Doctrine\ORM\Mapping\ClassMetadata
    factory: [ '@doctrine.orm.entity_manager', 'getClassMetadata' ]
    arguments:
      - '%sulu_media.collection_entity%'

  PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CollectionRepository:
    class: PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CollectionRepository
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@perspeqtive.sulu_media.collection_metadata'
      - '@sulu_security.access_control_query_enhancer'
      - '@security.helper'
      - '%sulu_security.permissions%'
    tags:
      - { name: 'sulu_security.access_control_descendant_provider' }

  PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CombinedCollectionRepository:
    class: PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CombinedCollectionRepository
    arguments:
      $security: '@security.helper'
      $requestStack: '@request_stack'
      $permissionAwareCollectionRepository: '@PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CollectionRepository'
      $mediaCollectionRepository: '@.inner'
    decorates: sulu_media.collection_repository

  Sulu\Bundle\MediaBundle\Entity\CollectionRepository:
    alias: 'PERSPEQTIVE\SuluPermissionAwareCollectionsBundle\Repository\CombinedCollectionRepository'
